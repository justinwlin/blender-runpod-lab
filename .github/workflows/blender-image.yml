name: Build Blender Runpod image

on:
  push:
    branches: [main, cat-persona]
    paths:
      - "docker/blender/**"
      - ".github/workflows/blender-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: justinwlin/blender-runpod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/blender
          file: docker/blender/Dockerfile
          push: true
          tags: |
            ghcr.io/justinwlin/blender-runpod:5.0.1
            ghcr.io/justinwlin/blender-runpod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Confirm the GHCR package is publicly pullable
        # Runpod can only pull this image without credentials if the package
        # is public. The Packages visibility API 404s for this user package
        # with GITHUB_TOKEN, but packages linked to this public repo are
        # already public. Verify with an anonymous GHCR pull instead of
        # failing the job on that API 404.
        run: |
          set -euo pipefail
          echo "Build digest: ${{ steps.build.outputs.digest }}"
          # Best-effort visibility update; a 404 is expected and not fatal.
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /user/packages/container/blender-runpod/visibility \
            -f visibility=public \
            && echo "Visibility API set the package public." \
            || echo "Visibility API did not succeed (often HTTP 404); checking anonymous pull."
          python3 - <<'PY'
          import json, sys, urllib.request
          token_url = "https://ghcr.io/token?service=ghcr.io&scope=repository:justinwlin/blender-runpod:pull"
          with urllib.request.urlopen(token_url, timeout=30) as r:
              token = json.loads(r.read().decode()).get("token") or ""
          if not token:
              sys.exit("anonymous GHCR token missing")
          req = urllib.request.Request(
              "https://ghcr.io/v2/justinwlin/blender-runpod/manifests/5.0.1",
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              digest = r.headers.get("Docker-Content-Digest")
              print("Anonymous pull of ghcr.io/justinwlin/blender-runpod:5.0.1 succeeded.")
              print("Digest:", digest)
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
